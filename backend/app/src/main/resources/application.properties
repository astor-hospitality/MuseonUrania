spring.application.name=portal

# 8080 на машине разработки занят чужим контейнером — не воюем за порт.
server.port=8081

# Плавная остановка. Без неё SIGTERM закрывает Tomcat немедленно: посетитель,
# отправлявший в этот момент заявку, получает обрыв соединения между записью
# в базу и ответом — и отправляет форму второй раз, уже с новым ключом
# идемпотентности. В CRM оказываются два одинаковых обращения.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Наружу отдаём только health: список бинов, конфиг и env — это карта системы.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Пробы разнесены на живость и готовность. Это разные решения: не прошедший
# readiness контейнер снимается с балансировки, не прошедший liveness —
# перезапускается. Слить их значит перезапускать приложение из-за базы,
# недоступной одну секунду.
management.endpoint.health.probes.enabled=true
# Готовность учитывает базу: пока миграции не применились, принимать заявки
# нельзя. Живость её не учитывает намеренно — перезапуск приложения базу
# не чинит.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Проверка здоровья почты выключена.
#
# spring-boot-starter-mail приносит индикатор, открывающий на каждый опрос
# соединение с SMTP. Пока адрес не задан, он падает всегда, и общий
# /actuator/health отдаёт DOWN — а опрашивает healthcheck контейнера именно
# его. Портал при этом работает: readiness и liveness зелёные, почта в их
# группы не входит.
#
# Но выключено это не ради пустого адреса, а по существу — по той же причине,
# по которой выше живость не учитывает базу. Письма уходят асинхронно, через
# очередь с выдержкой: недоступный SMTP означает «письмо подождёт час»,
# а не «портал сломан». Оставь проверку — и получасовые работы у почтового
# провайдера снимали бы портал с обслуживания и перезапускали его, ничем
# этому не помогая, заодно уронив сайт и приём заявок.
#
# Состояние очереди видно метриками vedal.mail.queued и vedal.mail.failed,
# и тревога поднимается по ним.
management.health.mail.enabled=false

# Спецификация OpenAPI и Swagger UI. По той же причине, что и с actuator:
# перечень дверей — карта системы, поэтому там, где лежат настоящие данные
# (prod, staging, internal), обе ручки выключены в профиле. Здесь значения
# для локальной разработки и lab.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Ответ в разобранном виде: спецификацию читают глазами и кладут в git.
springdoc.writer-with-order-by-keys=true

# Приложение стоит за обратным прокси. Без этого лимит частоты считает всех
# посетителей одним клиентом, а аудит пишет адрес прокси вместо адреса
# пользователя. Список доверенных прокси задаётся при развёртывании.
server.forward-headers-strategy=framework

# Как события покидают outbox: log, kafka или debezium.
#
# log      — событие уходит в лог, потребители работают в процессе.
#            Брокер не нужен, чтобы приложение работало. Значение по умолчанию.
# kafka    — relay читает outbox по расписанию и публикует сам.
# debezium — outbox читает коннектор по журналу предзаписи PostgreSQL,
#            приложение забирает события из топиков. Таблицу никто не
#            опрашивает, и задержка перестаёт зависеть от периода опроса.
#            Требует wal_level=logical на базе и запущенного Kafka Connect.
vedal.events.publisher=${VEDAL_EVENTS_PUBLISHER:log}
spring.kafka.bootstrap-servers=${VEDAL_KAFKA:localhost:9092}
vedal.events.group-id=${VEDAL_EVENTS_GROUP:vedal-portal}

# С начала топика, а не с конца: потребитель, поднявшийся впервые или после
# долгого простоя, обязан разобрать накопившееся, а не сделать вид, что его
# не было. Повторы отсекаются по (потребитель, событие), поэтому разбор
# с начала безопасен.
spring.kafka.consumer.auto-offset-reset=earliest
# Подтверждение смещения после успешного разбора, а не по расписанию:
# автокоммит отметил бы событие разобранным до того, как потребитель
# закончил работу, и падение посередине потеряло бы его.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Значения по умолчанию — локальная разработка, они же в compose.yaml.
# Прод и staging переопределяют переменными окружения: литеральный пароль
# в репозитории убирается только перезаписью истории.
spring.datasource.url=${VEDAL_DB_URL:jdbc:postgresql://localhost:5434/vedal}
spring.datasource.username=${VEDAL_DB_USER:vedal}
spring.datasource.password=${VEDAL_DB_PASSWORD:vedal}

# Схему ведёт Flyway. ddl-auto=update молча правит прод и ломает
# воспроизводимость восстановления из бэкапа.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Пул соединений. Значение по умолчанию — десять, и оно тесновато для стека,
# где одновременно работают сборка сайта, публичное API, админка и потребитель
# событий. Тайм-аут ожидания намеренно короткий: лучше быстрый отказ с понятной
# причиной, чем запрос, висящий полминуты и добивающий очередь.
spring.datasource.hikari.maximum-pool-size=${VEDAL_DB_POOL:16}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000

# Как портал проверяет вход в админское API: keycloak или local.
#
# keycloak — боевой режим: пароли, MFA и выдача токенов живут в Keycloak,
#   портал только проверяет подпись и разбирает роли realm_access.roles.
# local — запасной: HTTP Basic поверх учётных записей в таблице admin_user.
#   Режим разработки и режим «провайдера идентичности ещё нет».
#
# Правила доступа у обоих режимов одни и те же — см. SecurityConfig.
vedal.iam.mode=${VEDAL_IAM_MODE:local}
vedal.iam.client-id=${VEDAL_IAM_CLIENT_ID:vedal-portal}
# Адрес realm'а. Портал сам читает по нему конфигурацию OIDC и забирает ключи
# подписи. Нужен только в режиме keycloak.
vedal.iam.issuer=${VEDAL_OIDC_ISSUER:}
# Откуда забирать ключи подписи, если внешний адрес издателя порталу
# недоступен: в docker-сети и в закрытом контуре так и есть. Пусто — адрес
# ключей берётся из конфигурации OIDC по адресу издателя, и это правильный
# вариант, когда адрес один.
vedal.iam.jwks-uri=${VEDAL_OIDC_JWKS:}
# Кого токен должен называть получателем. Пусто — не проверяем: в Keycloak
# «из коробки» в aud лежит `account`, и требовать здесь имя клиента можно
# только настроив audience mapper на стороне realm'а.
vedal.iam.audience=${VEDAL_OIDC_AUDIENCE:}

# Справочник сотрудников: откуда портал берёт список ответственных.
#
# Читается административным API Keycloak от имени служебной учётной записи
# клиента. Секрет не задан — справочник берётся из таблицы admin_user, и это
# рабочее состояние, а не поломка: портал жил так до появления справочника.
#
# Прав служебной учётной записи нужно ровно одно — view-users. С manage-users
# утёкший секрет означает не «прочитали список сотрудников», а «завели себе
# учётную запись администратора».
# Клиент отдельный от vedal.iam.client-id: тот bearer-only и токенов не берёт —
# он только проверяет чужие. Проверяющий токены и ходящий за списком — разные
# роли, и клиенты у них разные.
vedal.iam.service-client-id=${VEDAL_OIDC_SVC_CLIENT_ID:vedal-portal-svc}
vedal.iam.service-client-secret=${VEDAL_OIDC_SVC_CLIENT_SECRET:}

# Realm и внутренний адрес Keycloak. Адрес нужен отдельно от издателя по той
# же причине, что и JWKS: в токене стоит внешний адрес, по которому за токеном
# ходил браузер, а из docker-сети он не резолвится.
vedal.iam.realm=${VEDAL_OIDC_REALM:vedal}
vedal.iam.admin-url=${VEDAL_OIDC_ADMIN_URL:}

# Первый администратор создаётся только если обе переменные заданы.
# Пароль в репозиторий не попадает. В режиме keycloak учётные записи заводятся
# там, и эти переменные не нужны.
vedal.admin.username=${VEDAL_ADMIN_USER:}
vedal.admin.password=${VEDAL_ADMIN_PASSWORD:}

# Версия текста согласия на обработку персональных данных. Меняется вместе
# с самим текстом на сайте: в заявке хранится версия, а не галочка.
vedal.consent.version=2026-08-09

# Откуда сайту разрешено ходить в публичные двери. Через запятую, схема и порт
# обязательны — это Origin, а не домен. По умолчанию адрес `next dev`.
vedal.web.allowed-origins=${VEDAL_ALLOWED_ORIGINS:http://localhost:3000}

# Лимиты частоты по адресу клиента, у каждой публичной двери свой бюджет.
vedal.forms.rate-limit.count=5
vedal.forms.rate-limit.window=PT10M
vedal.assistant.rate-limit.count=20
vedal.assistant.rate-limit.window=PT10M
vedal.chat.message-rate-limit.count=60
vedal.chat.message-rate-limit.window=PT10M

# Кто формулирует ответ Ведалины: deterministic — поиск по опубликованному,
# model — модель поверх того же поиска (старое значение yandexgpt принимается
# как model: уже развёрнутые окружения после обновления работают как раньше).
#
# Модель не заменяет поиск, а надстраивается над ним: материалы находит
# портал (у него есть каталог, новости и документы с учётом прав), модель
# только связывает найденное словами. Не нашлось материалов — модель
# не спрашивается вовсе: правило «нет опубликованных источников — нет
# ответа» сильнее желания что-нибудь сказать.
#
# По умолчанию search: на машине разработчика и в тестах ключей нет,
# а чат обязан работать. С model портал не поднимется без ключа —
# это намеренно, иначе он молча отвечал бы перечнем ссылок, и заметить
# это можно было бы только по тому, что ответы стали суше.
vedal.assistant.engine=${VEDAL_ASSISTANT_ENGINE:deterministic}

# Чья модель: yandex — YandexGPT (Yandex Foundation Models), gigachat —
# GigaChat (Сбер), cloudru — Cloud.ru Evolution Foundation Models (те же
# GigaChat и открытые модели за OpenAI-совместимой дверью, ключ статический).
# Одна переменная переключает провайдера, ключи у каждого свои (ниже).
# Умолчание — Яндекс: стенд, где переменная не задана, после обновления
# отвечает тем же, чем отвечал. Опечатка — отказ на старте, а не тихий
# откат к Яндексу.
vedal.assistant.provider=${VEDAL_LLM_PROVIDER:yandex}

# Does Vedalina show documents to site visitors: the quick button, direct file
# links, PDF passages and the /documents/ page. Off by default while the public
# documents section is hidden on the site (NEXT_PUBLIC_DOCUMENTS_ENABLED=false).
# Turn on together with the section. Staff assistant keeps its documents.
vedal.assistant.public-documents-enabled=${VEDAL_PUBLIC_DOCUMENTS_ENABLED:false}

# ————— общие для любой модели —————

# Что делать, когда модель молчит: true — отдать перечень найденного
# (материалы ведь нашлись), false — уйти к человеку.
#
# По умолчанию true. Ждать человека из-за чужой недоступности посетителю
# незачем, а ссылки у нас уже есть. Понадобится обратное — например, если
# перечень сочтут недостаточным ответом, — меняется настройкой.
# Старое имя переменной VEDAL_YANDEXGPT_FALLBACK принимается по-прежнему.
vedal.assistant.model.fallback=${VEDAL_LLM_FALLBACK:${VEDAL_YANDEXGPT_FALLBACK:true}}

# Низкая температура: ответ по материалам, а не сочинение. Выше — модель
# начинает пересказывать «вообще» и добавлять то, чего в материалах нет.
vedal.assistant.model.temperature=${VEDAL_LLM_TEMPERATURE:${VEDAL_YANDEXGPT_TEMPERATURE:0.2}}

# Ответ на два-четыре предложения. Предел стоит не ради денег, а ради
# читаемости: в окне чата простыня не читается, её пролистывают.
vedal.assistant.model.max-tokens=${VEDAL_LLM_MAX_TOKENS:${VEDAL_YANDEXGPT_MAX_TOKENS:600}}

# Дольше ждать нет смысла: посетитель уходит раньше. Не дождались —
# отдаём перечень найденного, он уже есть.
vedal.assistant.model.timeout=PT25S

# ————— провайдер yandex —————

# Ключ Yandex Cloud. Только из окружения: ключ — секрет, в репозитории ему
# не место, тем более что репозиторий публичный. Api-Key сервисного аккаунта,
# а не IAM-токен: статический ключ не протухает через двенадцать часов.
vedal.assistant.yandex.api-key=${VEDAL_YANDEXGPT_API_KEY:}

# Дверь Foundation Models. Настройкой — на случай выделенного эндпоинта
# или подмены при разборе: адрес меняется без пересборки.
vedal.assistant.yandex.endpoint=${VEDAL_YANDEXGPT_ENDPOINT:https://llm.api.cloud.yandex.net/foundationModels/v1/completion}

# Адрес модели целиком: gpt://<каталог>/yandexgpt-lite/latest. Одной строкой,
# а не парой «каталог + имя»: в таком виде его выдаёт консоль облака и в таком
# виде он уже лежит в окружении стенда. Собирать его из кусков значит завести
# второй способ ошибиться.
#
# yandexgpt-lite дешевле и быстрее старшей модели, а работа здесь простая:
# пересказать своими словами четыре найденных материала, ничего не добавив.
# Станет туго формулировать — меняется хвост адреса на yandexgpt/latest,
# пересборка не нужна.
vedal.assistant.yandex.model-uri=${VEDAL_YANDEXGPT_MODEL_URI:}

# ————— провайдер gigachat —————
#
# Доступ — через OAuth: ключ авторизации из кабинета developers.sber.ru
# (проект → GigaChat API → «Ключ авторизации») меняется на токен, токен
# живёт тридцать минут и обновляется порталом сам. Вместо готового ключа
# можно задать пару GIGACHAT_CLIENT_ID + GIGACHAT_CLIENT_SECRET того же
# проекта — ключ и есть base64 этой пары. Секреты только из окружения.
vedal.assistant.gigachat.auth-key=${GIGACHAT_AUTH_KEY:}
vedal.assistant.gigachat.client-id=${GIGACHAT_CLIENT_ID:}
vedal.assistant.gigachat.client-secret=${GIGACHAT_CLIENT_SECRET:}

# Область доступа — по типу договора с Сбером: GIGACHAT_API_PERS (физлицо,
# бесплатные токены), GIGACHAT_API_B2B (ИП и юрлицо, предоплата),
# GIGACHAT_API_CORP (юрлицо, постоплата). Не та область — 401 на обмене ключа.
vedal.assistant.gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}

# Модель генерации: GigaChat (быстрая и дешёвая — работа здесь простая,
# пересказать найденное), GigaChat-Pro, GigaChat-Max. Меняется без пересборки.
vedal.assistant.gigachat.model=${GIGACHAT_MODEL:GigaChat}

# Модель эмбеддингов: Embeddings или EmbeddingsGigaR. Одна на документы
# и вопросы — пары, как у Яндекса, у Сбера нет. Ожидаемая длина вектора
# сверяется с каждым ответом и с колонкой knowledge_chunk.embedding
# на старте: у Яндекса 256, у Сбера 1024, и смена провайдера эмбеддингов —
# это миграция колонки и полная переиндексация (docs/operations/gigachat_activation.md).
vedal.assistant.gigachat.embeddings-model=${GIGACHAT_EMBEDDINGS_MODEL:Embeddings}
vedal.assistant.gigachat.embeddings-dimension=${GIGACHAT_EMBEDDINGS_DIMENSION:1024}

# Двери Сбера. Настройкой — ради теста и на случай выделенного адреса.
vedal.assistant.gigachat.auth-url=${GIGACHAT_AUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
vedal.assistant.gigachat.api-url=${GIGACHAT_API_URL:https://gigachat.devices.sberbank.ru/api/v1}

# Сертификат Минцифры («Russian Trusted Root CA»), которым подписаны двери
# Сбера и которого нет в хранилище JVM. Путь к PEM-файлу; он ДОБАВЛЯЕТСЯ
# к штатным корням, а не заменяет их, и проверка TLS не выключается.
# В образе файл лежит в /app/certs/ (backend/certs/README.md). Пусто —
# только штатное хранилище; тогда соединение с Сбером, скорее всего,
# упадёт на PKIX, и это будет видно в журнале при первом вопросе.
vedal.assistant.gigachat.ca-bundle=${GIGACHAT_CA_BUNDLE:}

# ————— озвучивание ответов (TTS) —————
#
# Чей голос читает ответы в /voice/synthesize: yandex (SpeechKit, как было,
# ключ VEDAL_SPEECHKIT_API_KEY) или salute (SaluteSpeech Сбера). Настройка
# своя, не VEDAL_LLM_PROVIDER: модель и голос — разные договоры и ключи.
# Распознавание речи (/voice/recognize) остаётся на SpeechKit при любом
# значении. Опечатка — отказ на старте. Порядок включения —
# docs/operations/salutespeech_activation.md.
vedal.assistant.tts.provider=${VEDAL_TTS_PROVIDER:yandex}

# Провайдер salute. Ключ авторизации — ОТДЕЛЬНЫЙ проект «SaluteSpeech API»
# в кабинете developers.sber.ru, не ключ GigaChat; область доступа своя:
# SALUTE_SPEECH_PERS (физлицо), SALUTE_SPEECH_B2B (предоплата),
# SALUTE_SPEECH_CORP (постоплата). OAuth-дверь та же, что у GigaChat,
# токен на 30 минут, портал обновляет сам. Секрет только из окружения.
vedal.assistant.salute.auth-key=${SALUTE_AUTH_KEY:}
vedal.assistant.salute.scope=${SALUTE_SCOPE:SALUTE_SPEECH_PERS}

# Голос: Nec_24000 (Наталья), Bys_24000 (Борис), May_24000 (Марфа),
# Tur_24000 (Тарас), Ost_24000 (Александра), Pon_24000 (Сергей); суффикс —
# частота, у каждого есть вариант _8000. Формат ответа двери: wav16 (WAV
# с заголовком) или pcm16 (сырой PCM, заголовок допишет портал). Наружу
# в обоих случаях уходит audio/wav — контракт API не меняется.
vedal.assistant.salute.tts-voice=${SALUTE_TTS_VOICE:Nec_24000}
vedal.assistant.salute.tts-format=${SALUTE_TTS_FORMAT:wav16}

# Двери Сбера. Настройкой — ради теста и на случай выделенного адреса.
vedal.assistant.salute.auth-url=${SALUTE_AUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
vedal.assistant.salute.api-url=${SALUTE_API_URL:https://smartspeech.sber.ru}

# Корень Минцифры — тот же файл, что у GigaChat: по умолчанию наследует
# GIGACHAT_CA_BUNDLE, своя переменная нужна только если файлы разные.
vedal.assistant.salute.ca-bundle=${SALUTE_CA_BUNDLE:${GIGACHAT_CA_BUNDLE:}}

# ————— провайдер cloudru —————
#
# Cloud.ru Evolution Foundation Models: OpenAI-совместимая дверь, за которой
# те же модели GigaChat (и открытые модели) без OAuth и без корня Минцифры.
# Ключ — статический API-ключ из консоли (console.cloud.ru → Evolution
# Foundation Models → API-ключи), один на генерацию и эмбеддинги. Секрет
# только из окружения; порядок включения — docs/operations/cloudru_models_activation.md.
vedal.assistant.cloudru.api-key=${CLOUDRU_API_KEY:}

# Корень API; /chat/completions, /embeddings и /models — относительно него.
# Настройкой — ради теста и на случай выделенного адреса.
vedal.assistant.cloudru.base-url=${CLOUDRU_BASE_URL:https://foundation-models.api.cloud.ru/v1}

# Модель генерации — идентификатор с семейством, как его отдаёт /models:
# GigaChat/GigaChat-2-Max (умолчание), GigaChat/GigaChat-3-Pro. Меняется
# без пересборки.
vedal.assistant.cloudru.model=${CLOUDRU_MODEL:GigaChat/GigaChat-2-Max}

# Модель эмбеддингов: ai-sage/Giga-Embeddings-instruct-480M (умолчание) или
# ai-sage/Giga-Embeddings-instruct-3B. Одна на документы и вопросы.
# Размерность вектора у этих моделей документацией не названа, поэтому
# по умолчанию (0, пусто) портал узнаёт её по первому ответу модели — ещё
# на старте, до сверки с колонкой knowledge_chunk.embedding; заданное число
# сверяется с каждым ответом. Смена провайдера эмбеддингов — это миграция
# колонки и полная переиндексация (docs/operations/cloudru_models_activation.md).
vedal.assistant.cloudru.embeddings-model=${CLOUDRU_EMBEDDINGS_MODEL:ai-sage/Giga-Embeddings-instruct-480M}
vedal.assistant.cloudru.embeddings-dimension=${CLOUDRU_EMBEDDINGS_DIMENSION:0}

# Поиск по близости в индексе pgvector (RAG).
#
# По умолчанию выключен, и это не осторожность, а состояние дел: корпуса
# документов у VEDAL пока нет (GitHub issue #38), индексировать нечего,
# а каждый вопрос стоил бы вызова эмбеддингов ради заведомо пустой выдачи.
#
# Включённый RAG не заменяет поиск по словам, а становится перед ним:
# не нашлось в индексе — отвечает прежний поиск. Поэтому включить его можно
# и до корпуса, и на пустом индексе ассистент отвечает ровно как сейчас.
#
# Без ключа эмбеддингов портал с этой настройкой не поднимется — по той же
# причине, по которой не поднимается без ключа модели: половинчато настроенный
# RAG работал бы молча наполовину.
vedal.assistant.rag.enabled=${VEDAL_RAG_ENABLED:false}

# Чьи эмбеддинги: yandex, gigachat или cloudru. По умолчанию — тот же
# провайдер, что у генерации (VEDAL_LLM_PROVIDER), но настройка своя:
# генерацию можно перевести на GigaChat или Cloud.ru сегодня, а индекс
# оставить на Яндексе до окна на миграцию колонки и переиндексацию —
# размерности у провайдеров разные, и портал сверяет модель с колонкой
# на старте.
vedal.assistant.rag.provider=${VEDAL_RAG_PROVIDER:${VEDAL_LLM_PROVIDER:yandex}}

# Пара моделей поиска (провайдер yandex). Именно пара: документы кодируются одной, вопросы —
# другой, и векторы попадают в одно пространство ровно поэтому. Перепутать
# их — не отказ, а тихо испорченная выдача.
vedal.assistant.rag.document-model-uri=${VEDAL_RAG_DOCUMENT_MODEL_URI:}
vedal.assistant.rag.query-model-uri=${VEDAL_RAG_QUERY_MODEL_URI:}

# Дверь эмбеддингов Яндекса. Настройкой — ради теста и на случай выделенного адреса.
vedal.assistant.rag.endpoint=${VEDAL_RAG_ENDPOINT:https://llm.api.cloud.yandex.net/foundationModels/v1/textEmbedding}

# Насколько далёкий фрагмент ещё считается ответом: косинусное расстояние,
# 0 — то же самое, 1 — ничего общего. Порог нужен затем же, зачем порог
# у поиска по словам: ближайший фрагмент находится всегда, даже на вопрос
# про погоду.
#
# Значение до появления корпуса заведомо неточное — калибровать порог можно
# только на настоящих документах и настоящих вопросах. Поэтому оно и вынесено
# в настройку.
vedal.assistant.rag.max-distance=${VEDAL_RAG_MAX_DISTANCE:0.45}

# Эмбеддинг считается быстрее ответа модели: это одна короткая просьба,
# а не генерация текста.
vedal.assistant.rag.timeout=PT15S

# Часы, в которые в чате отвечают люди.
#
# Значения перенесены с сайта: «Пн–Пт 9:00–17:30» — часы отдела продаж
# (frontend/content/site.ts, phoneHours), зона — по адресу из реквизитов,
# Екатеринбург. Это не выдумка про поддержку: чат отвечают те же люди
# и в те же часы. Разойдутся — правится здесь, а не в коде.
#
# Часы обновлены по итогам просмотра стенда заказчиком 8 сентября,
# GitHub issue #76: было 9:00–18:00, верно 9:00–17:30.
#
# Расписание — только ориентир для посетителя, а не обещание. Надпись
# «на связи» портал ставит по факту: открыто ли сейчас рабочее место
# в админке. Праздников и переносов здесь нет намеренно — календарь
# рабочих дней надо откуда-то брать и поддерживать, а ошибка в нём
# означает «мы работаем» в день, когда никто не ответит.
vedal.support.days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
vedal.support.opens=09:00
vedal.support.closes=17:30
vedal.support.zone=Asia/Yekaterinburg

# Часов словами здесь НЕТ намеренно. Файлы .properties читаются как
# ISO-8859-1 — так велит спецификация Java Properties, — и кириллица отсюда
# приезжает в чат как «Ð¿Ð½âÐ¿Ñ». Молча: приложение поднимается, тесты
# зелёные, кракозябры видит только посетитель. Поймано глазами на поднятом
# стеке.
#
# Значение по умолчанию живёт в SupportHours; переопределяется переменной
# окружения VEDAL_SUPPORT_DESCRIPTION — окружение читается в UTF-8.

# Контакты для передачи человеку. Реквизиты с бланка датащитов,
# см. docs/products/README.md — не выдуманные значения.
vedal.contacts.phone=8 800 600 3449
vedal.contacts.email=sales@vedal-med.ru

# Ответственный за заявки. Адрес с бланка датащитов, см. docs/products/README.md.
# Пустое значение = уведомление менеджеру не отправляется; чужую почту
# по умолчанию не подставляем.
vedal.notifications.manager=sales@vedal-med.ru
# Адрес портала в письме менеджеру. На проде переопределяется окружением.
vedal.notifications.portal-url=${VEDAL_PORTAL_URL:http://localhost:8081}
vedal.notifications.max-attempts=5

# Транспорт писем — SMTP собственного почтового сервера домена,
# `mail.vedal-med.ru` (Postcow/mailcow, а не Яндекс 360, как планировалось
# в августе). Проверено 8 сентября: порт 465 с неявным TLS отвечает,
# сертификат Let's Encrypt выписан на `mail.vedal-med.ru`, вход по паре
# «полный адрес ящика + пароль» принимается (`235 Authentication successful`).
#
# Адрес сервера здесь НЕ задан, и это осознанно. Автоконфигурация Spring Boot
# заводит бин JavaMailSender ровно при наличии spring.mail.host, а по наличию
# этого бина модуль и решает, отправлять по-настоящему или писать в лог.
# Пустое значение (spring.mail.host=) для такого условия считается заданным:
# портал счёл бы почту настроенной и ронял бы каждое письмо на пустом адресе.
#
# Поэтому три переменные приходят только из окружения и только вместе:
#   SPRING_MAIL_HOST=mail.vedal-med.ru
#   SPRING_MAIL_USERNAME=<полный адрес ящика на домене>
#   SPRING_MAIL_PASSWORD=<пароль ящика>
#
# Пароль здесь — пароль самого ящика: своих «паролей приложения» у этого
# сервера нет, второго фактора на ящике тоже. Отсюда правило жёстче, а не
# мягче: у ящика заявок не должно быть ничего, кроме заявок, — ни доступа
# к панели управления доменом, ни общего с человеком почтового ящика.
# Отзывается такой пароль единственным способом — сменой пароля ящика.
spring.mail.port=465

# Неявный TLS с первого байта (порт 465), а не STARTTLS (587). При STARTTLS
# соединение начинается открытым, и посредник в сети может вырезать из ответа
# сервера предложение шифроваться — письмо уйдёт открытым текстом вместе
# с паролем, и клиент об этом не узнает.
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true

# Таймауты. У JavaMail по умолчанию нет ни одного из трёх: все бесконечные.
# Один зависший сокет — это транзакция базы, открытая навсегда, и вставшая
# очередь: следующий заход планировщика не начнётся, пока не кончится текущий.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Обратный адрес. Пусто — берётся spring.mail.username. Задавать отдельно
# нужно только если ящику разрешена отправка от другого адреса: почтовый
# сервер по умолчанию принимает письмо лишь от того ящика, под которым
# выполнен вход, и подменённый обратный адрес отвергает целиком.
vedal.notifications.from=${VEDAL_MAIL_FROM:}

# Открыт ли публичный раздел документов: перечень GET /api/public/v1/documents
# и выдача файла /documents/{slug}/file. Выключено, пока витрина документов
# на сайте скрыта решением заказчика (NEXT_PUBLIC_DOCUMENTS_ENABLED=false):
# раньше выключатель гасил витрину, а файлы оставались доступны по прямому
# адресу — каталог продукции, буклет, сертификат и датащиты скачивались мимо
# согласования. Переменная окружения здесь та же самая, что у витрины и
# у Ведалины: рубильник на сервере один, и одно его положение означает одно
# состояние портала.
#
# Админки это не касается: сотрудник видит и скачивает документы как прежде.
vedal.documents.public-enabled=${VEDAL_PUBLIC_DOCUMENTS_ENABLED:false}

# Объектное хранилище. local — каталог на диске, режим вёрстки без Docker.
# s3 — Yandex Object Storage, одно и то же хранилище и локально, и в облаке:
# различаются ключи и, при желании, имена бакетов.
vedal.storage.kind=${VEDAL_STORAGE_KIND:local}
vedal.storage.root=${VEDAL_STORAGE_ROOT:./var/documents}

# Предел на один файл. Двадцать мегабайт — рабочий размер датащита
# с иллюстрациями. Это же число ниже в multipart, в лимите тела API Gateway
# и в client_max_body_size на прокси: меньшее значение выше по цепочке роняет
# загрузку с 413 до приложения, и редактор видит страницу прокси вместо
# внятного отказа.
vedal.storage.max-file-size=20MB

vedal.storage.s3.endpoint=${VEDAL_S3_ENDPOINT:https://storage.yandexcloud.net}
vedal.storage.s3.region=${VEDAL_S3_REGION:ru-central1}
vedal.storage.s3.access-key=${VEDAL_S3_ACCESS_KEY:}
vedal.storage.s3.secret-key=${VEDAL_S3_SECRET_KEY:}
vedal.storage.s3.path-style=${VEDAL_S3_PATH_STYLE:true}
vedal.storage.s3.buckets.documents=${VEDAL_S3_BUCKET_DOCUMENTS:vedal-documents}
vedal.storage.s3.buckets.media=${VEDAL_S3_BUCKET_MEDIA:vedal-media}

# Разбор multipart обрывает чтение на превышении, не доводя тело до кучи —
# это и есть настоящая защита от большого файла, а проверка в хранилище
# вторая линия. Запас на request сверх file — поля формы, которые едут
# в том же теле.
spring.servlet.multipart.max-file-size=${vedal.storage.max-file-size}
spring.servlet.multipart.max-request-size=21MB
# Свыше мегабайта содержимое уходит во временный файл, а не остаётся в куче:
# иначе десять параллельных загрузок по 20 МБ — это 200 МБ heap.
spring.servlet.multipart.file-size-threshold=1MB

# Daily sales digest (enable in the environment that owns outgoing mail).
vedal.notifications.conversation-digest-enabled=${VEDAL_CONVERSATION_DIGEST_ENABLED:false}
